services:
  relay:
    build:
      context: ../..
      dockerfile: cloud/alert-relay/Dockerfile
    restart: unless-stopped
    environment:
      EGX_RELAY_ADMIN_TOKEN: ${EGX_RELAY_ADMIN_TOKEN:?Set a strong random relay admin token}
    ports:
      - "127.0.0.1:4318:8080"
    volumes:
      - relay-data:/data
volumes:
  relay-data:
